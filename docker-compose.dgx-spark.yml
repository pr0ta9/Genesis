# Docker Compose for NVIDIA DGX Spark (GB10) - ARM64 / Blackwell / CUDA 13.0
# Uses host Ollama with Nemotron 3 Super 120B
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dgx-spark
    container_name: genesis-backend-spark
    ports:
      - "8000:8000"
    environment:
      - GENESIS_KEEP_WORKSPACE=1
      - GENESIS_PROJECT_ROOT=/app
      - GENESIS_MODEL=nemotron-3-super:120b
      - DATABASE_URL=sqlite:///./genesis.db
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
      # Use host Ollama (already running Nemotron 3 Super 120B)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=host.docker.internal:11434
    env_file:
      - .env
    volumes:
      - genesis_data:/app/data
      - genesis_tmp:/app/tmp
      - genesis_inputs:/app/inputs
      - genesis_outputs:/app/outputs
      - genesis_db:/app/db
    networks:
      - genesis-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genesis-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    networks:
      - genesis-network
    restart: unless-stopped

volumes:
  genesis_data:
  genesis_tmp:
  genesis_inputs:
  genesis_outputs:
  genesis_db:

networks:
  genesis-network:
    driver: bridge
